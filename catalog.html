<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>目录 · BF Labs Skills</title>
  <link rel="stylesheet" href="assets/bflabs-ui/tokens.css" />
  <link rel="stylesheet" href="assets/bflabs-ui/base.css" />
  <link rel="stylesheet" href="assets/bflabs-ui/components.css" />
  <link rel="stylesheet" href="assets/skills-kit.css" />
  <link rel="stylesheet" href="assets/skills-site.css" />
</head>
<body class="bf-theme" data-tone="light">
  <header class="sk-header" id="site-header"></header>
  <main class="sk-page inner">
    <h1 class="bf-section-heading__title" data-i18n="catalogTitle"></h1>
    <div class="work-grid" id="work-grid"></div>
  </main>
  <footer class="sk-footer" id="site-footer"></footer>
  <div class="panel" id="panel" data-open="false"></div>
  <script src="assets/skills-kit.js"></script>
  <script>
    const { t, skillField, escapeHtml, padIndex, findSkill, boot } = window.BFSkillsUI;
    const panel = document.getElementById("panel");

    function paintGrid() {
      document.getElementById("work-grid").innerHTML = window.BFSkills.skills.map((item, index) => `
        <button class="bf-card bf-card--interactive work" type="button" data-id="${escapeHtml(item.id)}">
          <span class="bf-card__index">${padIndex(index)} / ${escapeHtml(item.tier)}</span>
          <div>
            <h2 class="bf-card__title">${escapeHtml(skillField(item, "name"))}</h2>
            <p class="bf-card__body">${escapeHtml(skillField(item, "blurb"))}</p>
          </div>
          <span class="bf-status-tag"><span class="bf-status-tag__dot"></span>${escapeHtml(item.hosts.join(" · "))}</span>
        </button>`).join("");
    }

    function childLinks(item) {
      if (!item.children || !item.children.length) return "";
      return `
        <div class="skill-links">
          <span class="skill-links__label">${escapeHtml(t("childSkills"))}</span>
          ${item.children.map((child) => `
            <a class="skill-links__item" href="${escapeHtml(child.href)}">
              <strong>${escapeHtml(skillField(child, "name"))}</strong>
              <span>${escapeHtml(skillField(child, "blurb"))}</span>
            </a>`).join("")}
        </div>`;
    }

    function openSkill(id) {
      const item = findSkill(id);
      if (!item) return;
      panel.dataset.open = "true";
      panel.innerHTML = `
        <article class="bf-confirmation-card">
          <span class="bf-confirmation-card__eyebrow">${escapeHtml(item.id)}</span>
          <h2 class="bf-confirmation-card__title">${escapeHtml(skillField(item, "name"))}</h2>
          <p class="bf-confirmation-card__description">${escapeHtml(skillField(item, "blurb"))}</p>
          <dl class="bf-confirmation-card__details">
            <div><dt>${escapeHtml(t("tier"))}</dt><dd>${escapeHtml(item.tier)}</dd></div>
            <div><dt>${escapeHtml(t("hosts"))}</dt><dd>${escapeHtml(item.hosts.join(" · "))}</dd></div>
            <div><dt>${escapeHtml(t("install"))}</dt><dd>${escapeHtml(skillField(item, "install"))}</dd></div>
          </dl>
          ${childLinks(item)}
          <div class="bf-confirmation-card__actions">
            ${item.href ? `<a class="bf-button bf-button--primary" href="${escapeHtml(item.href)}"><span>${escapeHtml(t("rootSkill"))}</span></a>` : ""}
            ${item.diagnose ? `<a class="bf-button bf-button--quiet" href="${escapeHtml(item.diagnose)}"><span>${escapeHtml(t("diagnose"))}</span></a>` : ""}
            <button class="bf-button bf-button--quiet" type="button" data-close>${escapeHtml(t("close"))}</button>
          </div>
        </article>`;
    }

    document.querySelector("main").addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (button) openSkill(button.dataset.id);
    });
    panel.addEventListener("click", (event) => {
      if (event.target === panel || event.target.closest("[data-close]")) {
        panel.dataset.open = "false";
        panel.innerHTML = "";
      }
    });
    function openFromHash() {
      const id = location.hash.replace(/^#/, "");
      if (id) openSkill(id);
    }

    window.addEventListener("bf-lang", () => {
      paintGrid();
      panel.dataset.open = "false";
      panel.innerHTML = "";
    });
    window.addEventListener("hashchange", openFromHash);
    boot({ page: "catalog", assetRoot: "assets" });
    paintGrid();
    openFromHash();
  </script>
</body>
</html>
